[project]
name = "intent-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
intent-parser = "intent_parser:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits the real API (costs money, needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not integration' --strict-markers"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]